match: "roblosats-v\\d+\\.\\d+\\.\\d+.*-arm64-v8a\\.apk"

name: Roblosats
summary: A simple and private bitcoin exchange, on the BLAKE2b chain
description: |
  Roblosats is a simple and private app to exchange bitcoin on the BLAKE2b chain (BTC) for national currencies, peer to peer, over its Lightning network. It is a fork of RoboSats: same robots, same hold-invoice escrow, same privacy, on the BLAKE2b chain.
  Features:
  - Privacy focused: your robot avatar is generated from a token, no registration, no KYC.
  - Built-in Tor: the app reaches the coordinators through their onion addresses.
  - Lightning hold invoices: both sides lock a fidelity bond; cheating is penalized.
  - The buyer can take the sats on-chain.
  - More than 15 languages and over 60 fiat currencies, priced from the BLAKE2b chain's own market.
  - PGP-encrypted chat with your peer.
  First coordinator: Kilobot. Community: https://t.me/roblosats
tags: [privacy, lightning, bitcoin, p2p, tor, exchange, foss, blake2b]
license: AGPL-3.0

